name: Release addon catalogue

# Triggered by a catalogue release tag ("catalogue-v1", "catalogue-v2", …).
#
# The unit of release is the WHOLE CATALOGUE, not one addon. That is
# deliberate: `addon-registry.json` is a single signed artifact describing
# every installable addon, so it has to be built from every addon and
# published as one set. The previous per-addon tag scheme ("stargate-v1.0.0")
# built only the tagged addon, and `build-registry.mjs` skips any addon with
# no tarball in the output directory — so each release published a registry
# containing exactly one addon and silently delisted all the others.
#
# Because every tarball this registry references is uploaded to the SAME
# release, `--base-url` below is correct for every entry, and the catalogue
# can never point at an asset that was not published alongside it.
#
# GO-LIVE TODO (see README.md): this workflow needs two repository settings
# that do not exist yet — the secret ADDON_SIGNING_KEY (the Ed25519 private
# key PEM) and the variable ADDON_SIGNING_KEY_ID (its keyId). A maintainer
# generates the key by hand, offline, using a ceremony script held outside
# this repo.
# Until both exist this workflow fails closed at the signing step rather
# than publishing anything unsigned.

on:
  push:
    tags:
      - "catalogue-v*"

# Restrict the signing step to a protected Environment once one exists, so
# the job can't be triggered from an arbitrary branch or PR (§6.7).
# environment: release-signing

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root tooling
        run: npm install --no-audit --no-fund

      # Every addon, every time. A catalogue that omits an addon delists it
      # for every user, so "which addons does this release cover" must not
      # depend on the tag.
      # Every addon in the publish set, every time. A catalogue that omits a
      # published addon delists it for every user, so "which addons does this
      # release cover" must come from catalogue.json — never from the tag, and
      # never from whatever happens to be in addons/.
      - name: Build every published addon tarball
        run: |
          set -euo pipefail
          for id in $(node -e "console.log((JSON.parse(require('fs').readFileSync('catalogue.json','utf8')).published||[]).join(' '))"); do
            echo "::group::build ${id}"
            node scripts/build-addon.mjs "$id"
            echo "::endgroup::"
          done

      # --require-all turns a skipped addon into a hard failure. Without it
      # build-registry.mjs only warns, which is how a one-addon registry got
      # published silently.
      # The sequence is the tag ordinal: catalogue-v7 -> 7. It MUST strictly
      # increase, because the app persists the highest sequence it has ever
      # verified and rejects anything lower. That is what stops an attacker
      # replaying an older — still validly signed — registry to erase a
      # withdrawal. Never re-tag a lower number, and never move an existing tag.
      - name: Derive catalogue sequence from tag
        id: seq
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          SEQ="${TAG#catalogue-v}"
          if ! printf '%s' "$SEQ" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::Tag '$TAG' does not carry a positive integer sequence (expected catalogue-vN)."
            exit 1
          fi
          echo "sequence=$SEQ" >> "$GITHUB_OUTPUT"

      - name: Build registry
        run: |
          node scripts/build-registry.mjs \
            --require-all \
            --sequence "${{ steps.seq.outputs.sequence }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

      # ── Signing: the ONLY step with access to the private key ───────────
      # No other job or step in this workflow reads the secret. CI never
      # generates key material — it only ever uses an already-generated one
      # (§6.7 "CI integration").
      - name: Sign registry
        env:
          ADDON_SIGNING_KEY: ${{ secrets.ADDON_SIGNING_KEY }}
          ADDON_SIGNING_KEY_ID: ${{ vars.ADDON_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ADDON_SIGNING_KEY:-}" ] || [ -z "${ADDON_SIGNING_KEY_ID:-}" ]; then
            echo "::error::ADDON_SIGNING_KEY secret and/or ADDON_SIGNING_KEY_ID variable are not set — see README.md GO-LIVE TODO. Failing rather than shipping an unsigned or test-key-signed registry."
            exit 1
          fi
          umask 077
          node -e "
            const fs = require('fs');
            fs.writeFileSync('/tmp/release-signing-key.json', JSON.stringify({
              keyId: process.env.ADDON_SIGNING_KEY_ID,
              privateKeyPem: process.env.ADDON_SIGNING_KEY,
            }));
          "
          node scripts/sign-registry.mjs --key /tmp/release-signing-key.json --registry release-build/addon-registry.json
          rm -f /tmp/release-signing-key.json

      # Verify what we are about to publish against the signature we just
      # made, using only the PUBLIC half. A registry that cannot verify here
      # would fail closed in every installed app, silently — better to find
      # that in CI.
      - name: Verify the signed registry before publishing
        run: node scripts/verify-registry.mjs --registry release-build/addon-registry.json

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-build/*.tgz
            release-build/*.sha256
            release-build/addon-registry.json
            release-build/addon-registry.json.sig
